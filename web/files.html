<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Files</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

    <div class="container text-center mt-5">
        <h1 class="mb-4">Stored CSV Files</h1>
        
        <div class="list-group">
            {% for file in files %}
                <a href="{{ url_for('download_file', filename=file) }}" download class="list-group-item list-group-item-action bg-secondary text-light">
                    {{ file }}
                </a>
            {% endfor %}
        </div>

        <a href="/" class="btn btn-outline-light mt-4">Go Back</a>
    </div>

    <!-- Bootstrap JS (Optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
